<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <!-- Font Serif Elegant & Sans-Serif -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="site-header">
    <div class="wrap nav-inner">
      <a class="logo" href="index.html" aria-label="NEVO, ke halaman utama">
        <img src="/assets/logo-nevo.svg" alt="NEVO">
      </a>
      <nav class="navlinks" aria-label="Navigasi utama">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="projek.html">Projek</a></li>
          <li><a href="contact.html" aria-current="page">Contact</a></li>
        </ul>
      </nav>
    <button class="menu-toggle" aria-label="Toggle menu">
      <span class="bar"></span><span class="bar"></span><span class="bar"></span>
    </button>
    </div>
  </header>


  <!-- Header / Hero Section Kontak -->
  <header class="contact-hero">
    <h1>Contact Us</h1>
    <p class="subtitle">Tolong hubungi saya jika anda memiliki pertanyaan.
  </header>

  <main class="contact-container">
    <!-- Form Kontak -->
    <section class="form-section">
      <form class="form-kontak" action="#" method="post">
        <div class="form-row">
          <div class="form-group">
            <input type="text" id="nama" name="nama" placeholder="Enter Name" required>
          </div>
          <div class="form-group">
            <input type="email" id="email" name="email" placeholder="Enter Email" required>
          </div>
        </div>

        <div class="form-group">
          <input type="tel" id="phone" name="phone" placeholder="Your Phone">
        </div>

        <div class="form-group">
          <textarea id="pesan" name="pesan" rows="4" placeholder="Your Message" required></textarea>
        </div>

        <button type="submit" class="btn-kirim">Send Message</button>
      </form>
    </section>

    <!-- Informasi Kontak Tambahan -->
    <section class="info-section">
      <div class="info-block">
        <h3>Information contact</h3>
        <p>Anda dapat menghubungi saya melalui email atau telepon.
        <p class="info-highlight">+62 813-8136-7040</p>
        <p class="info-highlight">kafiakmalfalah91@gmail.com</p>
      </div>

      </div>
    </section>
  </main>
</body>

</html>
